[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Runtime budgets, rate limits, and observability for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AgentGuard contributors"}]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
redis = ["redis>=5.0"]
quality = ["jsonschema>=4.23,<5"]
otel = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"]
test = ["pytest>=8.0"]
redis-test = ["fakeredis[lua]>=2.31,<3"]
console-test = ["pytest>=8.0", "httpx>=0.28", "httpx2>=2.0"]
console = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "httpx>=0.28,<1"]

[project.scripts]
agentguard = "agentguard.cli:main"
agentguard-console = "agentguard.api.http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
